<!doctype html>
<meta charset="utf-8" />
<title>Bug Recorder</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px ui-sans-serif, system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 6px; }
  button { margin-top: 8px; cursor: pointer; }
  p { margin: 8px 0 0; opacity: .7; font-size: 12px; }
</style>
<input id="description" placeholder="What is the bug?" />
<button id="toggle">Start recording</button>
<p id="hint"></p>
<script src="popup.js"></script>
